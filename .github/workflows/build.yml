# Builds the download: CapyPanel.exe in its folder, zipped, with the zip's SHA-256.
#
# - On a pull request that touches the app or how it's packaged: the zip is built and the built
#   exe runs its own self-test, so a file left out of the package fails here and not on
#   someone's PC. The zip is kept a few days with the run, to try before a release.
# - On a version's tag (v0.26.0): the same build, then a draft release with the zip and its
#   SHA-256 attached. A draft is seen by nobody until a maintainer publishes it by hand.
name: Build

on:
  pull_request:
    paths:
      - "src/**"
      - "packaging/**"
      - "scripts/build_exe.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build.yml"
  push:
    tags: ["v*"]

# Building only reads the code; the release job below asks for more, for itself only.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the build number counts every commit
          # A pull request's own last commit, not GitHub's trial merge of it: the exe then
          # says the build number and commit of what was pushed.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v10.2.0 # this action publishes exact versions only, no "v10" tag
        with:
          enable-cache: true
      - name: Install (exactly the versions in uv.lock)
        run: uv sync --locked --group build
      - name: The tag names the version being built
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(uv run python -c 'import capypanel; print(capypanel.__version__)')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME, but pyproject.toml says $version."
            exit 1
          fi
      - name: Build, self-test, zip
        run: uv run python scripts/build_exe.py
      - uses: actions/upload-artifact@v7
        with:
          name: CapyPanel-windows-x64
          path: |
            dist/CapyPanel-*-windows-x64.zip
            dist/CapyPanel-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the draft release and attach the files
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: CapyPanel-windows-x64
          path: dist
      - name: Draft the release (published by hand, after the checks on real equipment)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag \
            --title "CapyPanel ${GITHUB_REF_NAME#v} (beta)" \
            --notes "Release notes are added before this draft is published."
