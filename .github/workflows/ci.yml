# The checks every pull request must pass before it merges.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The checks only read the code.
permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # this action publishes exact versions only, no "v10" tag
        with:
          enable-cache: true
      - name: Install (exactly the versions in uv.lock)
        run: uv sync --locked
      - name: Lint (includes "core never imports the UI")
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Type check
        run: uv run pyright
      - name: Tests
        # Spread over every core: a few times faster.
        run: uv run pytest -n auto --dist loadgroup

  help-links:
    # Every place the app's help opens is on its docs page, in both languages. A job of its own:
    # docs lines come after the code freeze, so it can be red while the checks above are green.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install (exactly the versions in uv.lock)
        run: uv sync --locked
      - name: Help links
        run: uv run pytest tests/docs -m docs_links
