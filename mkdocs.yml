# The documentation website, built from docs/ with MkDocs Material and published to GitHub Pages.
site_name: CapyPanel
site_description: Every computer you look after, in one window.
site_url: https://gabrielmariense.github.io/CapyPanel/
repo_url: https://github.com/gabrielmariense/CapyPanel
repo_name: gabrielmariense/CapyPanel
edit_uri: edit/main/docs/
# In every page's footer, so a reader always knows which version the pages describe.
copyright: These pages describe CapyPanel 0.26.3.

# A band for the pages about the whole app, then one per tool, each in its own folder of docs/.
nav:
  - Start:
      - Home: README.md
      - Download and updates: download.md
      - Getting started: getting-started.md
      - What's new: whats-new.md
      - Code signing policy: code-signing.md
  - Hosts:
      - Host lists: hosts/host-lists.md
      - Connecting: hosts/connecting.md
      - Checking: hosts/checking.md
      - Commands: hosts/commands.md
  - Printers:
      - The Printers tool: printers/printers.md
      - Checking: printers/checking.md
  - User profiles:
      - The User profiles tool: profiles/user-profiles.md
  - Settings and files: settings-and-files.md

theme:
  name: material
  logo: images/docs-logo.svg
  favicon: images/favicon.ico
  features:
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode

# English pages are name.md, their Portuguese versions name.pt-BR.md beside them.
plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: pt-BR
          name: Português (Brasil)
          build: true
          site_description: Todos os computadores sob seus cuidados, em uma só janela.
          copyright: Estas páginas descrevem o CapyPanel 0.26.3.
          nav_translations:
            Start: Início
            Home: Página inicial
            Download and updates: Baixar e atualizar
            Getting started: Primeiros passos
            What's new: Novidades
            Code signing policy: Política de assinatura de código
            Settings and files: Configurações e arquivos
            Hosts: Hosts
            Host lists: Listas de hosts
            Connecting: Conectando
            Checking: Verificando
            Commands: Comandos
            Printers: Impressoras
            The Printers tool: A ferramenta Impressoras
            User profiles: Perfis de usuário
            The User profiles tool: A ferramenta Perfis de usuário

# The brand: the navy header, the teal links and the site name's font.
extra_css:
  - stylesheets/brand.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

validation:
  links:
    anchors: warn
