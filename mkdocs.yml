# The documentation website, built from docs/ with MkDocs Material and published to GitHub Pages.
site_name: CapyPanel
site_description: Every computer you look after, in one window.
site_url: https://gabrielmariense.github.io/CapyPanel/
repo_url: https://github.com/gabrielmariense/CapyPanel
repo_name: gabrielmariense/CapyPanel
edit_uri: edit/main/docs/

# Two bands: the pages about the whole app, then the Hosts tool's own, in docs/hosts/.
nav:
  - Start:
      - Home: README.md
      - Getting started: getting-started.md
      - Settings and files: settings-and-files.md
      - Development: development.md
  - Hosts:
      - Host lists: hosts/host-lists.md
      - Importing and exporting: hosts/importing.md
      - Connecting: hosts/connecting.md
      - Checking: hosts/checking.md
      - Searching: hosts/searching.md

theme:
  name: material
  features:
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode

# English pages are name.md, their Portuguese versions name.pt-BR.md beside them.
plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: pt-BR
          name: Português (Brasil)
          build: true
          site_description: Todos os computadores sob seus cuidados, em uma só janela.
          nav_translations:
            Start: Início
            Home: Página inicial
            Getting started: Primeiros passos
            Settings and files: Configurações e arquivos
            Development: Desenvolvimento
            Hosts: Hosts
            Host lists: Listas de hosts
            Importing and exporting: Importando e exportando
            Connecting: Conectando
            Checking: Verificando
            Searching: Pesquisando

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

validation:
  links:
    anchors: warn
