<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>CapyPanel mascot: capybara working at a computer</title>
  <defs>
    <linearGradient id="fur" gradientUnits="userSpaceOnUse" x1="289" y1="76" x2="110" y2="432">
      <stop offset="0" stop-color="#ebc394"/>
      <stop offset="0.55" stop-color="#e0a265"/>
      <stop offset="1" stop-color="#d4853b"/>
    </linearGradient>
    <linearGradient id="slate" x1="0.85" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#7a88ad"/>
      <stop offset="1" stop-color="#233661"/>
    </linearGradient>
    <linearGradient id="screen" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3fd9c4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5d84"/>
      <stop offset="1" stop-color="#233661"/>
    </linearGradient>
  </defs>
  <g transform="translate(0 22)">

  <!-- ===== monitor ===== -->
  <g id="monitor">
    <rect x="392" y="368" width="34" height="32" fill="#233661" stroke="#1b2742" stroke-width="6"/>
    <rect x="364" y="394" width="90" height="16" rx="8" fill="url(#slate)" stroke="#1b2742" stroke-width="6"/>
    <rect x="318" y="194" width="176" height="178" rx="26" fill="url(#slate)" stroke="#1b2742" stroke-width="7"/>
    <rect x="334" y="210" width="144" height="146" rx="14" fill="url(#screen)"/>
    <circle cx="384" cy="236" r="7" fill="#ecfdf5"/>
    <rect x="398" y="231" width="62" height="10" rx="5" fill="#ccfbf1"/>
    <circle cx="384" cy="266" r="7" fill="#ecfdf5"/>
    <rect x="398" y="261" width="70" height="10" rx="5" fill="#ccfbf1"/>
    <circle cx="384" cy="296" r="7" fill="#fbbf24"/>
    <rect x="398" y="291" width="48" height="10" rx="5" fill="#ccfbf1"/>
    <circle cx="384" cy="326" r="7" fill="#ecfdf5"/>
    <rect x="398" y="321" width="58" height="10" rx="5" fill="#ccfbf1"/>
    <path d="M446 214 L476 214 L476 246 Z" fill="#ffffff" opacity="0.2"/>
  </g>

  <!-- ===== capybara ===== -->
  <g id="capybara">
    <!-- ears (behind the head) -->
    <path d="M86 132 C66 112 72 78 100 72 C124 68 138 90 134 112" fill="url(#fur)" stroke="#6e3517" stroke-width="8" stroke-linejoin="round"/>
    <path d="M94 120 C84 106 90 88 104 86 C116 85 122 98 120 110" fill="#d8914f"/>
    <path d="M190 86 C186 62 200 46 218 48 C238 50 246 74 238 94" fill="url(#fur)" stroke="#6e3517" stroke-width="8" stroke-linejoin="round"/>
    <path d="M200 84 C198 70 206 60 217 61 C228 62 232 76 228 88" fill="#e5ad78"/>

    <!-- one silhouette: body + head, snout pointing at the screen -->
    <path d="M36 432 C42 384 54 336 70 292 C78 262 58 206 68 162 C78 116 122 88 174 82 C226 76 276 92 304 122 C326 146 334 190 326 228 C320 256 304 274 284 284 C292 324 300 376 306 432 Z"
          fill="url(#fur)" stroke="#6e3517" stroke-width="8" stroke-linejoin="round"/>

    <!-- belly -->
    <path d="M116 432 C122 368 164 334 210 334 C254 334 280 380 286 432 Z" fill="#ebb67f"/>

    <!-- muzzle -->
    <path d="M222 150 C260 132 314 140 326 182 C332 220 314 262 278 278 C248 290 210 280 200 252 C190 222 196 168 222 150 Z" fill="#ebb67f"/>
    <!-- nose pad + nostrils -->
    <path d="M246 134 C278 122 318 130 326 156 C332 180 314 200 284 204 C256 208 234 194 232 172 C230 154 236 140 246 134 Z" fill="#6e3517"/>
    <ellipse cx="262" cy="168" rx="8" ry="11" transform="rotate(-38 262 168)" fill="#542710"/>
    <ellipse cx="300" cy="160" rx="7.5" ry="10.5" transform="rotate(22 300 160)" fill="#542710"/>

    <!-- mouth -->
    <path d="M284 204 C287 222 283 238 272 248" fill="none" stroke="#6e3517" stroke-width="7" stroke-linecap="round"/>
    <path d="M226 236 C238 258 260 260 272 248 C276 256 284 258 291 256" fill="none" stroke="#6e3517" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- happy eye -->
    <path d="M150 160 C158 140 184 138 194 156" fill="none" stroke="#4a230e" stroke-width="9" stroke-linecap="round"/>

    <!-- fur flicks -->
    <path d="M80 366 C72 392 70 412 72 430" fill="none" stroke="#6e3517" stroke-width="6" stroke-linecap="round"/>
    <path d="M126 386 C114 402 108 416 108 430" fill="none" stroke="#6e3517" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- ===== desk ===== -->
  <rect x="12" y="406" width="488" height="28" rx="14" fill="url(#desk)" stroke="#1b2742" stroke-width="6"/>

  <!-- mug -->
  <path d="M26 356 L72 356 L68 404 C68 408 64 410 60 410 L38 410 C34 410 30 408 30 404 Z" fill="#f8fafc" stroke="#1b2742" stroke-width="6" stroke-linejoin="round"/>
  <path d="M72 368 C88 368 88 394 70 394" fill="none" stroke="#1b2742" stroke-width="6" stroke-linecap="round"/>
  <rect x="34" y="372" width="30" height="8" rx="4" fill="#14b8a6"/>
  <path d="M40 342 C34 332 46 326 40 316 M56 342 C50 332 62 326 56 316" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>

  <!-- keyboard -->
  <rect x="160" y="390" width="186" height="20" rx="8" fill="#e2e8f0" stroke="#1b2742" stroke-width="6"/>
  <path d="M176 400 h14 M200 400 h14 M224 400 h14 M248 400 h14 M272 400 h14 M296 400 h32" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>

  <!-- ===== arms + paws (one on each side of the belly) ===== -->
  <!-- capybara's right arm (viewer's left) -->
  <path d="M124 352 C142 370 160 384 176 394 L226 390 C212 372 194 354 172 336 Z" fill="url(#fur)"/>
  <path d="M124 352 C142 370 160 384 176 394 M172 336 C194 354 212 372 226 390" fill="none" stroke="#6e3517" stroke-width="8" stroke-linecap="round"/>
  <path d="M178 392 C176 378 192 372 204 374 C218 376 224 388 218 396 C212 404 186 404 180 398 Z" fill="#6e3517" stroke="#6e3517" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="196" cy="386" rx="4" ry="6" transform="rotate(30 196 386)" fill="#542710"/>
  <ellipse cx="210" cy="388" rx="3.5" ry="5.5" transform="rotate(30 210 388)" fill="#542710"/>
  <!-- capybara's left arm (viewer's right): starts at the shoulder, below the chin -->
  <path d="M240 340 C254 358 264 376 268 392 L318 388 C312 364 302 342 291 323 C276 330 258 336 240 340 Z" fill="url(#fur)"/>
  <path d="M240 340 C254 358 264 376 268 392 M291 323 C302 342 312 364 318 388" fill="none" stroke="#6e3517" stroke-width="8" stroke-linecap="round"/>
  <path d="M270 390 C268 374 286 368 300 370 C316 372 322 386 316 394 C310 404 280 404 274 398 Z" fill="#6e3517" stroke="#6e3517" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="288" cy="382" rx="4.5" ry="7" transform="rotate(30 288 382)" fill="#542710"/>
  <ellipse cx="304" cy="384" rx="4" ry="6.5" transform="rotate(30 304 384)" fill="#542710"/>
  <!-- chin shadow + jaw line, drawn over the arm tops so the arms tuck under the chin -->
  <g id="chin">
    <path d="M206 300 C238 300 272 292 290 278 C293 292 294 308 291 322 C276 332 260 336 244 336 C220 338 194 318 206 300 Z" fill="#d38640" opacity="0.85"/>
    <path d="M212 298 C240 298 266 290 284 276" fill="none" stroke="#6e3517" stroke-width="8" stroke-linecap="round"/>
    <!-- body outline re-stroked over the shadow, down to where the arm takes over -->
    <path d="M326 228 C320 256 304 274 284 284 C286.4 296 288.8 309.1 291.2 323.1" fill="none" stroke="#6e3517" stroke-width="8" stroke-linecap="round"/>

  </g>
  </g>
</svg>
